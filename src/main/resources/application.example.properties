spring.application.name=HytaleServerManager
server.port=port

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mariadb://db_host:db_port/db_name
spring.datasource.username=db_user
spring.datasource.password=db_password
spring.jpa.open-in-view=false

spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true

springdoc.api-docs.enabled=true
server.forward-headers-strategy=framework

jwt.secret=secret
jwt.issuer=issuer

auth.base-url=https://auth.example.com
auth.device-token-path=/opt/lostaria-device-token/device.token

pubsub.base-url=https://pubsub.example.com

hytale.profile-uuid=profile-uuid
